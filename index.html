<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arbre Généalogique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header id="site-header">
    <div class="header-left">
      <div class="logo-mark">🌳</div>
      <div>
        <h1 class="site-title">Arbre Généalogique</h1>
        <p class="site-subtitle" id="tree-name-display">Ma Famille</p>
      </div>
    </div>
    <nav class="header-nav">
      <button class="nav-btn" onclick="fitView()" title="Tout afficher">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
        Centrer
      </button>
      <button class="nav-btn" onclick="zoomIn()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button class="nav-btn" onclick="zoomOut()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button class="nav-btn accent" onclick="openAddModal(null)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Ajouter
      </button>
      <button class="nav-btn" onclick="openExport()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exporter
      </button>
      <button class="nav-btn" onclick="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M4.93 19.07l1.41-1.41M19.07 19.07l-1.41-1.41M21 12h-2M5 12H3M12 21v-2M12 5V3"/></svg>
      </button>
    </nav>
  </header>

  <!-- ===== LÉGENDE ===== -->
  <div id="legend-bar">
    <div class="legend-item"><span class="leg-swatch" data-gen="0"></span> Génération 1</div>
    <div class="legend-item"><span class="leg-swatch" data-gen="1"></span> Génération 2</div>
    <div class="legend-item"><span class="leg-swatch" data-gen="2"></span> Génération 3</div>
    <div class="legend-item"><span class="leg-swatch" data-gen="3"></span> Génération 4</div>
    <div class="legend-item"><span class="leg-swatch" data-gen="4"></span> Génération 5</div>
    <div class="legend-sep"></div>
    <div class="legend-item"><span class="leg-gender m"></span> Homme</div>
    <div class="legend-item"><span class="leg-gender f"></span> Femme</div>
    <div class="legend-item" id="member-count">— membres</div>
  </div>

  <!-- ===== CANVAS ===== -->
  <div id="canvas-wrap">
    <div id="canvas-inner">
      <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="empty-state">
      <div class="empty-icon">🌱</div>
      <p class="empty-title">Votre arbre est vide</p>
      <p class="empty-sub">Commencez par ajouter l'ancêtre fondateur de votre famille.</p>
      <button class="btn-primary" onclick="openAddModal(null)">+ Ajouter le premier membre</button>
    </div>
  </div>

  <!-- ===== MODAL MEMBRE ===== -->
  <div class="modal-overlay" id="member-modal" aria-modal="true" role="dialog">
    <div class="modal-box" id="member-modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-heading">Nouveau membre</h2>
        <button class="modal-close" onclick="closeModal('member-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row two-col">
          <div class="form-group">
            <label for="f-firstname">Prénom <span class="req">*</span></label>
            <input type="text" id="f-firstname" placeholder="ex : Marie" autocomplete="off"/>
          </div>
          <div class="form-group">
            <label for="f-lastname">Nom de famille <span class="req">*</span></label>
            <input type="text" id="f-lastname" placeholder="ex : Dupont" autocomplete="off"/>
          </div>
        </div>

        <div class="form-group">
          <label for="f-gender">Genre</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="gender" value="M" id="g-m" checked/> Homme</label>
            <label class="radio-label"><input type="radio" name="gender" value="F" id="g-f"/> Femme</label>
            <label class="radio-label"><input type="radio" name="gender" value="N" id="g-n"/> Autre</label>
          </div>
        </div>

        <div class="form-row two-col">
          <div class="form-group">
            <label for="f-birth">Date de naissance</label>
            <input type="date" id="f-birth"/>
          </div>
          <div class="form-group">
            <label for="f-birthplace">Lieu de naissance</label>
            <input type="text" id="f-birthplace" placeholder="ex : Paris, France"/>
          </div>
        </div>

        <div class="form-row two-col">
          <div class="form-group">
            <label for="f-death">Date de décès</label>
            <input type="date" id="f-death"/>
          </div>
          <div class="form-group">
            <label for="f-deathplace">Lieu de décès</label>
            <input type="text" id="f-deathplace" placeholder="Laisser vide si vivant(e)"/>
          </div>
        </div>

        <div class="form-group">
          <label for="f-parent">Parent (père ou mère)</label>
          <select id="f-parent">
            <option value="">— Aucun (ancêtre racine) —</option>
          </select>
        </div>

        <div class="form-group">
          <label for="f-spouse">Conjoint(e) (lien affiché)</label>
          <select id="f-spouse">
            <option value="">— Aucun —</option>
          </select>
        </div>

        <div class="form-group">
          <label for="f-notes">Notes / Biographie</label>
          <textarea id="f-notes" rows="3" placeholder="Profession, anecdotes, lieu de vie…"></textarea>
        </div>

        <div class="form-group">
          <label for="f-photo">URL photo (optionnel)</label>
          <input type="url" id="f-photo" placeholder="https://…"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-danger" id="btn-delete" onclick="confirmDelete()" style="display:none">Supprimer</button>
        <div style="flex:1"></div>
        <button class="btn-ghost" onclick="closeModal('member-modal')">Annuler</button>
        <button class="btn-primary" onclick="saveMember()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL FICHE DÉTAIL ===== -->
  <div class="modal-overlay" id="detail-modal" aria-modal="true" role="dialog">
    <div class="modal-box detail-box">
      <div class="modal-header">
        <h2 class="modal-title" id="detail-name">—</h2>
        <button class="modal-close" onclick="closeModal('detail-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="detail-hero">
          <div class="detail-avatar" id="detail-avatar"></div>
          <div class="detail-info">
            <p id="detail-dates" class="detail-meta"></p>
            <p id="detail-places" class="detail-meta"></p>
            <p id="detail-gen" class="detail-gen-badge"></p>
          </div>
        </div>
        <div id="detail-notes" class="detail-notes"></div>
        <div id="detail-family" class="detail-family"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="closeModal('detail-modal')">Fermer</button>
        <button class="btn-primary" id="detail-edit-btn" onclick="editFromDetail()">✏ Modifier</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL PARAMÈTRES ===== -->
  <div class="modal-overlay" id="settings-modal" aria-modal="true" role="dialog">
    <div class="modal-box" style="max-width:400px">
      <div class="modal-header">
        <h2 class="modal-title">Paramètres</h2>
        <button class="modal-close" onclick="closeModal('settings-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="s-treename">Nom de l'arbre</label>
          <input type="text" id="s-treename" placeholder="Ma Famille"/>
        </div>
        <div class="form-group">
          <label>Thème de couleur</label>
          <div class="theme-swatches" id="theme-picker"></div>
        </div>
        <div class="form-group">
          <label>Orientation</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="orient" value="top" checked/> Haut → Bas</label>
            <label class="radio-label"><input type="radio" name="orient" value="left"/> Gauche → Droite</label>
          </div>
        </div>
        <div class="form-group">
          <label>Données</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-ghost" onclick="importData()">📥 Importer JSON</button>
            <button class="btn-ghost" onclick="exportJSON()">📤 Exporter JSON</button>
            <button class="btn-danger" onclick="clearAll()">🗑 Tout effacer</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="saveSettings()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL EXPORT ===== -->
  <div class="modal-overlay" id="export-modal" aria-modal="true" role="dialog">
    <div class="modal-box" style="max-width:380px">
      <div class="modal-header">
        <h2 class="modal-title">Exporter</h2>
        <button class="modal-close" onclick="closeModal('export-modal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-muted);margin-bottom:16px">Choisissez le format d'export :</p>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="export-option" onclick="exportSVG()">
            <span class="exp-icon">🖼</span>
            <div><strong>SVG</strong><br/><small>Image vectorielle, qualité maximale</small></div>
          </button>
          <button class="export-option" onclick="exportJSON()">
            <span class="exp-icon">📄</span>
            <div><strong>JSON</strong><br/><small>Données brutes, réimportables</small></div>
          </button>
          <button class="export-option" onclick="printTree()">
            <span class="exp-icon">🖨</span>
            <div><strong>Imprimer</strong><br/><small>Mise en page pour impression</small></div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast"></div>

  <!-- ===== INPUT FICHIER CACHÉ ===== -->
  <input type="file" id="file-input" accept=".json" style="display:none" onchange="handleImport(event)"/>

  <script src="script.js"></script>
</body>
</html>
